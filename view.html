<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>glyphTV</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      color: #8a8a93; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    #wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #glcanvas { display: block; max-width: 100vw; max-height: 100vh; cursor: pointer; }
    #stats { position: fixed; left: 14px; bottom: 12px; color: #5c5c66;
      transition: opacity 0.6s; pointer-events: none; }
    #unmute { position: fixed; right: 14px; bottom: 10px; display: none;
      background: rgba(23, 23, 27, 0.85); color: #c9c9d1; border: 1px solid #2a2a30;
      border-radius: 999px; padding: 5px 12px; font: inherit; cursor: pointer;
      transition: opacity 0.6s; }
    body.idle #stats { opacity: 0; }
    body.idle #unmute { opacity: 0; }
    body.idle #glcanvas { cursor: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="glcanvas"></canvas>
  </div>
  <span id="stats">tuning…</span>
  <button id="unmute">🔇 unmute</button>
  <div id="inspect" style="position:fixed;display:none;pointer-events:none;background:rgba(10,10,14,0.92);border:1px solid #2a2a30;border-radius:8px;padding:8px 12px;z-index:9;line-height:1.5">
    <span id="inspGlyph" style="font-size:34px;color:#fff;display:block;text-align:center"></span>
    <span id="inspMeta" style="color:#8a8a93"></span>
  </div>
  <script type="module" src="/src/view.ts"></script>
</body>
</html>
