<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>glyphcast — cast</title>
  <style>
    body { margin: 0; background: #0a0a0c; color: #8a8a93; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    #wrap { width: min(94vw, 1500px); margin: 20px auto; }
    #glcanvas { display: block; cursor: pointer; }
    #stats { display: block; padding: 12px 2px; color: #5c5c66; }
    video { display: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="glcanvas"></canvas>
    <span id="stats">connecting…</span>
    <span style="display:block;padding:2px;color:#3c3c44">drop a video file anywhere to cast it · <button id="open" style="background:#17171b;color:#c9c9d1;border:1px solid #2a2a30;border-radius:4px;padding:2px 8px;font:inherit;cursor:pointer">open video…</button></span>
    <input id="file" type="file" accept="video/*" style="display:none" />
  </div>
  <video id="video" muted loop playsinline autoplay></video>
  <script type="module" src="/src/cast.ts"></script>
</body>
</html>
