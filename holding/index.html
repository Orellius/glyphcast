<!doctype html>
<!-- glyphcast.tv holding page. Self-contained, no deps. The "screen" is a <pre>
     of halfblock glyphs with per-cell colors - under construction, stated in the
     medium itself. Replaced by the real site when it ships. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyphcast — video as text</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
    background: #0a0a0c; color: #8a8a94;
    font: 15px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    padding: 24px;
  }
  pre {
    font: 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0; user-select: text; cursor: text;
  }
  h1 { font-size: 17px; font-weight: 600; color: #d4d4dc; }
  h1 span { color: #3ddc84; }
  p { max-width: 52ch; text-align: center; }
  small { color: #55555e; font-size: 12px; }
  @media (max-width: 760px) { pre { font-size: 6px; } }
</style>
</head>
<body>
<pre id="screen" aria-hidden="true"></pre>
<h1>glyph<span>cast</span> — video as text</h1>
<p>Every frame is a grid of Unicode glyphs. The wire never carries pixels.
The screen above is plain text — select it.</p>
<small>under construction</small>
<script>
const W = 76, H = 44; // pixel grid; renders as W x H/2 halfblock cells
const screen = document.getElementById('screen');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

// muted phosphor palette: deep slate -> moss -> phosphor green
const stops = [[14,14,20],[24,40,32],[22,96,56],[61,220,132]];
function shade(v) { // v in [0,1] -> rgb
  const f = Math.min(0.999, Math.max(0, v)) * (stops.length - 1);
  const i = f | 0, t = f - i, a = stops[i], b = stops[i + 1];
  return [0,1,2].map(k => (a[k] + (b[k] - a[k]) * t) | 0);
}
function px(x, y, t) {
  const v = Math.sin(x * 0.16 + t) + Math.sin(y * 0.11 - t * 0.7)
          + Math.sin((x + y) * 0.07 + t * 0.4) + Math.sin(Math.hypot(x - W/2, y - H/2) * 0.18 - t);
  return shade(v / 8 + 0.5);
}
function frame(t) {
  let out = '';
  for (let r = 0; r < H; r += 2) {
    for (let x = 0; x < W; x++) {
      const fg = px(x, r, t), bg = px(x, r + 1, t);
      out += `<span style="color:rgb(${fg});background:rgb(${bg})">▀</span>`;
    }
    out += '\n';
  }
  screen.innerHTML = out;
}
frame(1.7);
if (!still) {
  let t = 1.7;
  setInterval(() => { if (!document.hidden) frame(t += 0.05); }, 80);
}
</script>
</body>
</html>
